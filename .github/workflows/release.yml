name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p neko-cli --target ${{ matrix.target }} --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="neko-words-${version}-${{ matrix.target }}"
          mkdir -p "dist/${package}"
          cp "target/${{ matrix.target }}/release/neko-words" "dist/${package}/neko-words"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          shasum -a 256 "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: neko-words-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "Release ${GITHUB_REF_NAME}"
          fi

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: publish
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Skip when token is not configured
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: |
          echo "::notice::Set the HOMEBREW_TAP_TOKEN repository secret to update jyokotori/homebrew-tap automatically."

      - name: Download artifacts
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checkout Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: jyokotori/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mac_target="aarch64-apple-darwin"
          linux_target="x86_64-unknown-linux-gnu"
          mac_sha="$(cut -d ' ' -f 1 "dist/neko-words-${version}-${mac_target}.tar.gz.sha256")"
          linux_sha="$(cut -d ' ' -f 1 "dist/neko-words-${version}-${linux_target}.tar.gz.sha256")"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/neko-words.rb <<EOF
          class NekoWords < Formula
            desc "Local-first vocabulary builder with spaced repetition"
            homepage "https://github.com/jyokotori/neko-words"
            version "${version}"
            license "Apache-2.0"

            if OS.mac? && Hardware::CPU.arm?
              url "https://github.com/jyokotori/neko-words/releases/download/v${version}/neko-words-${version}-${mac_target}.tar.gz"
              sha256 "${mac_sha}"
            elsif OS.linux? && Hardware::CPU.intel?
              url "https://github.com/jyokotori/neko-words/releases/download/v${version}/neko-words-${version}-${linux_target}.tar.gz"
              sha256 "${linux_sha}"
            else
              odie "No prebuilt neko-words package is available for this platform."
            end

            def install
              bin.install "neko-words"
            end

            test do
              assert_match "neko-words #{version}", shell_output("#{bin}/neko-words --version")
            end
          end
          EOF

      - name: Commit and push formula update
        if: env.HOMEBREW_TAP_TOKEN != ''
        working-directory: homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- Formula/neko-words.rb)" ]; then
            echo "Formula is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/neko-words.rb
          git commit -m "Update neko-words to ${GITHUB_REF_NAME}"
          git push
